# SPDX-License-Identifier: LGPL-3.0-or-later
# Build the solid_xl image (containers/Dockerfile: eic_xl + ffmpeg + gmsh + lAger + this repository) and publish it to the
# GitHub container registry of the repository owner: ghcr.io/<owner>/solid_xl.
#
#   - a pushed tag v*      -> ghcr.io/<owner>/solid_xl:<tag> and :latest
#   - "Run workflow"       -> ghcr.io/<owner>/solid_xl:<image tag input> (default dev); :latest only if asked
#   - a pull request that changes the image recipe -> build and test only, nothing is published
#
# The image is tested before it is pushed. Users get it with `containers/install.sh --solid-xl [OWNER]`.
# A new package is private at first: make it public once under the owner's Packages settings.
name: image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["containers/Dockerfile", "containers/profile.d/**", "containers/patches/**", "containers/spack-gaudi.yaml", ".github/workflows/image.yml"]
  workflow_dispatch:
    inputs:
      eic_tag:
        description: "eic_xl release to build on"
        default: "26.10.0-stable"
      image_tag:
        description: "tag of the published image"
        default: "dev"
      latest:
        description: "also tag it latest"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  solid_xl:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the eic_xl base image needs about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - name: Names and tags
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"; latest=true
          else
            tag="${{ inputs.image_tag }}"; latest="${{ inputs.latest }}"
          fi
          echo "image=ghcr.io/${owner}/solid_xl" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-dev}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest:-false}" >> "$GITHUB_OUTPUT"
          echo "eic_tag=${{ inputs.eic_tag || '26.10.0-stable' }}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          docker build -f containers/Dockerfile \
            --build-arg EIC_TAG=${{ steps.names.outputs.eic_tag }} \
            --build-arg IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }} \
            -t ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }} .
          df -h /
      - name: Test
        run: |
          docker run --rm ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }} bash -lc '
            set -e
            ffmpeg -version | head -1
            python3 -c "import gmsh; gmsh.initialize(); print(\"gmsh\", gmsh.__version__); gmsh.finalize()"
            test "$(command -v lager)" = /opt/lager/bin/lager
            lager --help > /dev/null && echo "lager: starts"
            echo "DETECTOR_PATH=${DETECTOR_PATH} DETECTOR_CONFIG=${DETECTOR_CONFIG}"
            test -f "${DETECTOR_PATH}/${DETECTOR_CONFIG}.xml"
            python3 -c "
          import os, dd4hep
          d = dd4hep.Detector.getInstance()
          d.fromCompact(os.path.join(os.environ[\"DETECTOR_PATH\"], \"solid_JPsi_lite.xml\"))
          b = d.field().magneticField(dd4hep.Position(0, 0, 0))
          print(\"Bz(0,0) = %.4f T\" % (b.z() / dd4hep.tesla))
          assert abs(b.z() / dd4hep.tesla) > 1.0
          "'
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          if [[ "${{ steps.names.outputs.latest }}" == "true" ]]; then
            docker tag ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }} ${{ steps.names.outputs.image }}:latest
            docker push ${{ steps.names.outputs.image }}:latest
          fi
          echo "Published ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }} (eic_xl ${{ steps.names.outputs.eic_tag }})" >> "$GITHUB_STEP_SUMMARY"
